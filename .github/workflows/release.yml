name: Release

# Push a tag like v1.0.1 (matching package.json's version) to build the
# Windows installer and portable exe, sign them with Microsoft Artifact Signing
# (formerly Azure Trusted Signing) and attach them to a GitHub Release.
# Signing needs three repo secrets from the signing app registration:
#   AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # No dependency cache: the exes people download are built from a clean install.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Check the tag matches package.json
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $v"; exit 1
          fi
      - run: npm ci
      - run: npm test
      # Only this step sees the signing credentials, not `npm ci` and its install scripts.
      # dist:signed stops if it can't sign, so an unsigned build never ships.
      - run: npm run dist:signed
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      # Every release ships both: the installer and the portable exe. Stop if either is missing.
      - name: Check both exes were built
        shell: bash
        run: |
          for f in dist/RFC-Report-Generator-Setup.exe dist/RFC-Report-Generator-Portable.exe; do
            if [ ! -s "$f" ]; then echo "Missing or empty: $f"; exit 1; fi
            echo "$f: $(stat -c %s "$f") bytes"
          done
      # Checks the CN alone, not the full subject: a revalidation with a new address changes the rest.
      - name: Check the exes are signed
        shell: pwsh
        run: |
          foreach ($f in "dist/RFC-Report-Generator-Setup.exe", "dist/RFC-Report-Generator-Portable.exe", "dist/win-unpacked/RFC Report Generator.exe") {
            $sig = Get-AuthenticodeSignature $f
            if ($sig.Status -ne 'Valid') { throw "$f is not validly signed: $($sig.Status)" }
            if ($sig.SignerCertificate.Subject -notmatch '^CN=Michael McGahan,') { throw "$f is signed by someone else: $($sig.SignerCertificate.Subject)" }
            Write-Host "${f}: $($sig.SignerCertificate.Subject)"
          }
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## Download

            | File | Use it when |
            |------|-------------|
            | `RFC-Report-Generator-Setup.exe` | You want to install the app. It adds a Start menu entry and opens `.rfcreport` files. |
            | `RFC-Report-Generator-Portable.exe` | You want to run the app without installing it, for example from a USB drive. |

            Windows 10 or 11, 64-bit. The exes are signed by Michael McGahan.
          files: |
            dist/RFC-Report-Generator-Setup.exe
            dist/RFC-Report-Generator-Portable.exe
