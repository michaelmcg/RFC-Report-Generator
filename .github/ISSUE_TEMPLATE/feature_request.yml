name: Feature request
description: Suggest something the app should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you are trying to do and what gets in the way.
      placeholder: When I write a change report, I have to...
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What would you like the app to do?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part of the app?
      options:
        - Report form or sections
        - Report text and layout
        - Export, copy or file format
        - Settings or templates
        - Menus, shortcuts or look
        - Something else
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Example
      description: If it changes the report text, show how the new part should look.
      render: text
