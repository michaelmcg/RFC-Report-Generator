name: Bug report
description: Something in the app does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The more exact the steps, the faster the fix.
        Remove sensitive details (client names, hostnames, patient data) before you attach anything.

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the problem. Include any error message exactly as it appears.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a new report
        2. Set Category to Change
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version
      description: Help > About shows it.
      placeholder: "1.1.1"
    validations:
      required: true

  - type: dropdown
    id: build
    attributes:
      label: Which download?
      options:
        - Installer (RFC-Report-Generator-Setup.exe)
        - Portable (RFC-Report-Generator-Portable.exe)
        - Built from source
    validations:
      required: true

  - type: dropdown
    id: windows
    attributes:
      label: Windows version
      options:
        - Windows 11
        - Windows 10
        - Other
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Screenshots or report text
      description: Paste a screenshot, or the part of the report text that looks wrong. Remove anything sensitive first.

  - type: checkboxes
    id: dns
    attributes:
      label: Due diligence
      options:
        - label: I checked, and it was not DNS.
